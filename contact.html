 <!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vespera | Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="transparent-nav hero-nav">
        <div class="logo-container">
            <a href="index.html"><img src="images/logo-ves.png" alt="Vespera Logo"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="nav-icons" style="margin-right: 120px;">
            <a href="javascript:void(0);" onclick="toggleSearchModal()" id="search-icon" title="Search"><i class="fas fa-search"></i></a>
            <a href="contact.html" title="Account"><i class="fas fa-user"></i></a>
            <a href="#" id="cart-icon" title="Shopping Bag">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <section class="contact-section" style="padding-top: 150px; text-align: center; padding-bottom: 50px;">
        <div style="max-width: 500px; margin: 0 auto; background: rgba(245, 230, 220, 0.65); backdrop-filter: blur(10px); padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid rgba(179, 121, 101, 0.4);">
            
            <h2 style="font-size: 32px; color: #4d332b; font-family: 'Playfair Display', serif; margin-bottom: 10px;">Contact Us</h2>
            <p style="color: #6b4c42; margin-bottom: 25px; font-size: 15px;">We would love to hear from you!</p>

            <!-- الفورم مربوط برابط الـ Formspree الخاص بك -->
            <form id="contact-form" action="https://formspree.io/f/xbgojqrw" method="POST" onsubmit="handleContactSubmit(event)" style="display: flex; flex-direction: column; gap: 15px;" novalidate>
                
                <div style="position: relative; text-align: left;">
                    <input type="text" id="contact-name" name="name" placeholder="Your Name" autocomplete="off" required 
                           style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #A8886F; background: #F9F3EC; color: #6E5243; outline: none; font-size: 14px;"
                           onfocus="showNameSuggestions()" oninput="filterNameSuggestions()">
                    
                    <div id="name-suggestions" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: #F9F3EC; border: 1px solid #A8886F; border-radius: 8px; margin-top: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); z-index: 1000; max-height: 150px; overflow-y: auto;">
                        <div onclick="selectName('Malak Emad')" style="padding: 10px 15px; cursor: pointer; color: #6E5243; border-bottom: 1px solid rgba(168,136,111,0.2); font-size: 14px;">Malak Emad</div>
                        <div onclick="selectName('Malak Shahin')" style="padding: 10px 15px; cursor: pointer; color: #6E5243; font-size: 14px;">Malak Shahin</div>
                    </div>
                </div>
                
                <input type="email" id="contact-email" name="email" placeholder="Your Email" autocomplete="email" required 
                       style="padding: 12px; border-radius: 8px; border: 1px solid #A8886F; background: #F9F3EC; color: #6E5243; outline: none; font-size: 14px;">
                
                <textarea id="contact-msg" name="message" placeholder="Your Message" rows="4" required 
                          style="padding: 12px; border-radius: 8px; border: 1px solid #A8886F; background: #F9F3EC; color: #6E5243; outline: none; font-size: 14px;"></textarea>
                
                <button type="submit" style="padding: 12px; font-size: 15px; cursor: pointer; background: #6E5243; color: #F9F3EC; border: none; border-radius: 8px; font-weight: 600; transition: background 0.3s;">
                    Send Message 💌
                </button>
            </form>

            <div id="thankyou-msg" style="display: none; padding: 20px; background: #EADCCB; color: #6E5243; border-radius: 10px; text-align: center; font-family: 'Playfair Display', serif;">
                ✨ <strong style="font-size: 18px; display: block; margin-bottom: 8px;">Thank you so much!</strong> 
                Your message has been sent successfully. We truly value your thoughts and will get back to you shortly! 🌸
            </div>

        </div>

        <div style="margin-top: 30px;">
            <a href="index.html" class="btn-add" style="text-decoration: none; display: inline-block; padding: 10px 25px; background: #6E5243; color: #F9F3EC; border-radius: 8px; font-weight: 600;">Back to Home</a>
        </div>
    </section>

    <div id="search-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #F9F3EC; padding: 30px; border-radius: 20px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative;">
            <span onclick="toggleSearchModal()" style="position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #6E5243;">&times;</span>
            
            <h3 style="font-family: 'Playfair Display', serif; margin-bottom: 15px; color: #6E5243;">Search Products 🔍</h3>
            
            <input type="text" id="search-input" onkeyup="handleLiveSearch(event)" placeholder="Type to search products..." style="width: 100%; padding: 12px; border: 1px solid #A8886F; border-radius: 8px; background: #EADCCB; color: #6E5243; outline: none; font-size: 14px;">
            
            <div id="search-results" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        function toggleSearchModal() {
            const modal = document.getElementById('search-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
            }
        }

        function handleLiveSearch(event) {
            const query = event.target.value;
            const resultsContainer = document.getElementById('search-results');
            if (query.trim() === '') {
                resultsContainer.innerHTML = '';
                return;
            }
            resultsContainer.innerHTML = '<p style="color: #6E5243; font-size: 13px;">Searching...</p>';
        }

        function showNameSuggestions() {
            document.getElementById('name-suggestions').style.display = 'block';
        }

        function selectName(fullName) {
            document.getElementById('contact-name').value = fullName;
            document.getElementById('name-suggestions').style.display = 'none';
        }

        function filterNameSuggestions() {
            const box = document.getElementById('name-suggestions');
            box.style.display = 'block';
        }

        document.addEventListener('click', function(event) {
            const nameContainer = document.getElementById('contact-name');
            const suggestions = document.getElementById('name-suggestions');
            if (!nameContainer.contains(event.target) && !suggestions.contains(event.target)) {
                suggestions.style.display = 'none';
            }
        });

        async function handleContactSubmit(event) {
            event.preventDefault();
            
            const nameInput = document.getElementById('contact-name');
            const emailInput = document.getElementById('contact-email');
            const msgInput = document.getElementById('contact-msg');
            const form = document.getElementById('contact-form');
            const thankYouMsg = document.getElementById('thankyou-msg');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const message = msgInput.value.trim();

            if (!name || !email || !message) {
                alert('Please fill in all required fields before sending your message.');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }

            const formData = new FormData(form);
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.style.display = 'none';
                    thankYouMsg.style.display = 'block';
                } else {
                    alert('Oops! There was a problem sending your message.');
                }
            } catch (error) {
                alert('Connection error. Please check your internet.');
            }
        }
    </script>
</body>
</html>
